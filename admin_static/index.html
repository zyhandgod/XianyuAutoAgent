<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地管理</title><link rel="stylesheet" href="/style.css"><script src="/auth.js" defer></script><script src="/app.js" defer></script></head>
<body class="locked"><section id="auth-view"><div class="auth-card"><div class="eyebrow">YOUR WORKSPACE</div><h1 id="auth-title">登录工作空间</h1><p id="auth-note">使用账号密码访问自己的商品、卡密和记录。</p><form id="auth-form"><label for="username">用户名</label><input id="username" autocomplete="username" required minlength="3" maxlength="32" placeholder="3–32位字母、数字或下划线"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required maxlength="128" placeholder="请输入密码"><div id="confirm-password-row" hidden><label for="confirm-password">确认密码</label><input id="confirm-password" type="password" autocomplete="new-password" maxlength="128" placeholder="再次输入密码"></div><p id="auth-error" role="alert"></p><button class="primary" id="auth-submit" type="submit">登录</button></form><div class="auth-foot">每个账号独立管理 · 密码安全存储</div></div></section><aside><div class="nav-label">工作空间</div><nav><button data-tab="products" class="active">▦ <span>商品与卡密</span></button><button data-tab="orders">⇄ <span>发货记录</span></button><button data-tab="settings">⚙ <span>运行设置</span></button><button id="users-nav" data-tab="users" hidden>♙ <span>账号管理</span></button></nav><div class="side-note"><span class="dot"></span> 仅在本机运行<small>数据保存在你的电脑上</small></div></aside>
<main><header><div class="breadcrumb">工作空间 <span>/</span> <b id="crumb">商品与卡密</b></div><div class="session-tools"><span id="login-user"></span><button class="text-button" data-auth="password">修改密码</button><button class="text-button" data-auth="logout">退出</button><div class="account" id="account">正在读取配置</div></div></header><div class="content"><div class="title-row"><div><div class="eyebrow">FULFILLMENT CONSOLE</div><h1 id="title">商品与卡密</h1><p id="subtitle">管理商品、维护库存，让每一笔交付都有记录。</p></div><div id="top-action"></div></div><div id="service-banner" class="banner"></div><section class="stats" id="stats"></section><section id="view"></section><footer>本地卡密管理 · 真实发货依据闲鱼订单状态，聊天关键词不会触发</footer></div></main>
<dialog id="dialog"><form id="dialog-form"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" class="icon-button" id="close-dialog" aria-label="关闭">×</button></div><div id="dialog-body"></div><div class="dialog-actions"><button type="button" class="secondary" id="cancel-dialog">取消</button><button class="primary" type="submit" id="dialog-save">保存</button></div></form></dialog><div role="status" id="toast" hidden></div></body></html>
